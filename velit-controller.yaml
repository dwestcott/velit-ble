esphome:
  name: velit-controller
  friendly_name: "Velit BLE Controller"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: use a static IP for reliability
  # manual_ip:
  #   static_ip: 192.168.1.100
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

  ap:
    ssid: "Velit Controller"
    password: !secret ap_password

captive_portal:

# Sync time for heater clock sync and HA timestamps
time:
  - platform: homeassistant
    id: ha_time

# Load custom Velit components from local directory
external_components:
  - source:
      type: local
      path: components

# BLE scanner
esp32_ble_tracker:
  scan_parameters:
    active: true

# =============================================================================
# BLE Client Connections
# =============================================================================
# Update MAC addresses to match your devices.
# Find them with nRF Connect or ESPHome BLE tracker logs.
# Velit devices advertise as "VELIT", "VLIT", or "D30".

ble_client:
  - mac_address: !secret velit_ac_mac
    id: velit_ac_ble

  - mac_address: !secret velit_heater_mac
    id: velit_heater_ble

# =============================================================================
# VELIT 3000R AIR CONDITIONER
# =============================================================================

velit_ac:
  id: velit_ac_controller
  ble_client_id: velit_ac_ble
  update_interval: 6s

climate:
  - platform: velit_ac
    id: velit_ac_climate
    name: "Velit AC"
    velit_ac_id: velit_ac_controller

  - platform: velit_heater
    id: velit_heater_climate
    name: "Velit Heater"
    velit_heater_id: velit_heater_controller

switch:
  - platform: velit_ac
    id: velit_swing
    name: "Velit AC Swing"
    icon: "mdi:arrow-oscillating"
    velit_ac_id: velit_ac_controller

# Swing jog pulse length. The AC enforces COMMAND_THROTTLE_MS = 400ms between
# commands, so anything below 400 is clamped by the component — the effective
# pulse is max(this value, 400ms). Tune to taste once you've seen how fast your
# vanes sweep: shorter = finer aiming, longer = fewer taps.
number:
  - platform: template
    name: "Velit AC Swing Jog Duration"
    id: velit_swing_jog_ms
    icon: "mdi:timer-cog-outline"
    optimistic: true
    restore_value: true
    initial_value: 600
    min_value: 400
    max_value: 3000
    step: 100
    unit_of_measurement: "ms"
    entity_category: config

button:
  # Nudge the swing vanes. There is no position command in the protocol — the
  # vanes oscillate while swing is ON and freeze in place when it goes OFF, so
  # aiming them means pulsing. Tap repeatedly to walk them to where you want.
  - platform: template
    name: "Velit AC Swing Jog"
    icon: "mdi:arrow-up-down"
    on_press:
      - switch.turn_on: velit_swing
      - delay: !lambda "return (uint32_t) id(velit_swing_jog_ms).state;"
      - switch.turn_off: velit_swing

  - platform: template
    name: "Velit AC Vent"
    icon: "mdi:air-filter"
    on_press:
      - lambda: |-
          id(velit_ac_controller).vent_toggle();

  - platform: template
    name: "Velit Heater Ventilation Start"
    icon: "mdi:fan"
    on_press:
      - lambda: |-
          id(velit_heater_controller).start_ventilation();

  - platform: template
    name: "Velit Heater Ventilation Stop"
    icon: "mdi:fan-off"
    on_press:
      - lambda: |-
          id(velit_heater_controller).stop_ventilation();

  # Fuel prime — runs the fuel pump for 30s without ignition.
  # Useful for bleeding air after fuel filter / glow plug service, or
  # confirming fuel delivery before an ignition attempt. Auto-stops at 30s.
  - platform: template
    name: "Velit Heater Fuel Prime Start"
    icon: "mdi:fuel"
    on_press:
      - lambda: |-
          id(velit_heater_controller).start_fuel_prime();

  - platform: template
    name: "Velit Heater Fuel Prime Stop"
    icon: "mdi:fuel-cell"
    on_press:
      - lambda: |-
          id(velit_heater_controller).stop_fuel_prime();

  # Cleaning cycle — high-temp burnoff to clear carbon. Runs at 100% gear
  # until complete (5–15 min). Cannot be manually stopped per protocol.
  - platform: template
    name: "Velit Heater Cleaning Cycle"
    icon: "mdi:broom"
    on_press:
      - lambda: |-
          id(velit_heater_controller).start_cleaning();

# =============================================================================
# VELIT DIESEL HEATER
# =============================================================================

velit_heater:
  id: velit_heater_controller
  ble_client_id: velit_heater_ble
  update_interval: 5s

# =============================================================================
# SENSORS
# =============================================================================

sensor:
  # --- AC Sensors ---
  - platform: template
    name: "Velit AC Ambient Temperature"
    id: velit_ac_ambient_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return id(velit_ac_controller).get_ambient_temp_c();

  # --- Heater Sensors ---
  - platform: template
    name: "Velit Heater Voltage"
    id: velit_heater_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(velit_heater_controller).get_voltage();

  - platform: template
    name: "Velit Heater Fan RPM"
    id: velit_heater_fan_rpm
    unit_of_measurement: "RPM"
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:fan"
    update_interval: 10s
    lambda: |-
      return id(velit_heater_controller).get_fan_rpm();

  - platform: template
    name: "Velit Heater Inlet Temperature"
    id: velit_heater_inlet_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(velit_heater_controller).get_inlet_temp_c();

  - platform: template
    name: "Velit Heater Altitude"
    id: velit_heater_altitude
    unit_of_measurement: "ft"
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:altimeter"
    update_interval: 30s
    lambda: |-
      return id(velit_heater_controller).get_altitude();

  # --- System ---
  - platform: wifi_signal
    name: "Velit Controller WiFi Signal"
    update_interval: 60s

# Text sensors for fault and machine state
text_sensor:
  - platform: template
    name: "Velit Heater Fault"
    id: velit_heater_fault
    icon: "mdi:alert-circle"
    update_interval: 10s
    lambda: |-
      uint8_t fault = id(velit_heater_controller).get_fault();
      switch (fault) {
        case 0: return std::string("No Fault");
        case 1: return std::string("Ignition Failure");
        case 2: return std::string("Abnormal Flame Out");
        case 3: return std::string("Voltage Deviation");
        case 4: return std::string("Heat Exchanger Temp");
        case 5: return std::string("Ignition Sensor");
        case 6: return std::string("Outlet Temp Sensor");
        case 7: return std::string("Fuel Pump");
        case 8: return std::string("Fan Fault");
        case 9: return std::string("Inlet Temp Sensor");
        case 10: return std::string("Glow Plug");
        case 11: return std::string("Ambient Temp Anomaly");
        case 12: return std::string("Altitude Out of Range");
        case 13: return std::string("Fan Blockage");
        case 14: return std::string("CO Exceeded");
        case 15: return std::string("LIN Communication");
        default: return std::string("Unknown");
      }

  - platform: template
    name: "Velit Heater State"
    id: velit_heater_state
    icon: "mdi:fire"
    update_interval: 10s
    lambda: |-
      uint8_t state = id(velit_heater_controller).get_machine_state();
      switch (state) {
        case 0: return std::string("Standby");
        case 1: return std::string("Normal");
        case 2: return std::string("Cooling Down");
        case 3: return std::string("Overtemp Standby");
        case 4: return std::string("Cleaning");
        case 5: return std::string("Clean Complete");
        default: return std::string("Unknown");
      }

  # Current work mode (Manual vs Thermostat). Settable via climate preset
  # ("None" = Manual, "Home" = Thermostat) but not visible from there —
  # this exposes it as a readable text sensor for dashboards/automations.
  - platform: template
    name: "Velit Heater Mode"
    id: velit_heater_mode
    icon: "mdi:cog"
    update_interval: 10s
    lambda: |-
      uint8_t m = id(velit_heater_controller).get_mode();
      // 1 = Manual, 2 = Thermostat (per protocol)
      return std::string(m == 2 ? "Thermostat" : "Manual");

# BLE connection status
# Note: ble_presence won't work here — connected devices stop advertising.
# Use template sensors that check if we're receiving data instead.
binary_sensor:
  - platform: template
    name: "Velit AC BLE Connected"
    device_class: connectivity
    lambda: |-
      return id(velit_ac_controller).is_connected();

  - platform: template
    name: "Velit Heater BLE Connected"
    device_class: connectivity
    lambda: |-
      return id(velit_heater_controller).is_connected();
